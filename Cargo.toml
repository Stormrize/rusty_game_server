[package]
name = "rusty_game_console_server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["json"] }
chess = "3.2.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
uuid = { version = "1.29.0", features = ["v4"] }
